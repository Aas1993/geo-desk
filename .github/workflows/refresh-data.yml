name: Refresh official data
# The UAE agreements dataset comes from MOFA and the Ministry of Foreign Trade. This rebuilds it every day and, when anything changed,
# opens a pull request so a human sees what changed (a new CEPA or treaty showing up is itself news). A failed scrape fails the run and changes nothing.
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
permissions: { contents: write, pull-requests: write }
concurrency: { group: refresh-data, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node scripts/build-agreements.mjs
      - name: Open a PR if the data changed
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # "built" changes every run, so compare everything else
          git diff --quiet -I'"built":"[^"]*"' public/data/agreements.json && { echo "No data changes"; exit 0; }
          branch="data/agreements-$(date -u +%Y%m%d)"
          git config user.name "geo-desk-bot"; git config user.email "geo-desk-bot@users.noreply.github.com"
          git checkout -b "$branch"; git add public/data/agreements.json
          git commit -m "Refresh UAE agreements data ($(date -u +%F))"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Refresh UAE agreements data ($(date -u +%F))" --body "Automated daily rebuild from MOFA and the Ministry of Foreign Trade. Review the diff for new or removed agreements, especially CEPAs. Sources are listed in \`scripts/build-agreements.mjs\`."
