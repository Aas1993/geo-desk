name: Refresh media tone
# Reads GDELT's raw 15-minute event files (static downloads, no rate limit): about 4,300 small files, three minutes. Runs daily and opens a PR when the data changed.
on:
  schedule: [{ cron: "41 2 * * *" }]
  workflow_dispatch:
permissions: { contents: write, pull-requests: write }
concurrency: { group: refresh-media, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node scripts/build-media-tone.mjs
      - name: Open a PR if the data changed
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          node scripts/data-changed.mjs public/data/media-tone.json || { echo "No data changes"; exit 0; }
          branch="data/media-tone-$(date -u +%Y%m%d)"
          git config user.name "geo-desk-bot"; git config user.email "geo-desk-bot@users.noreply.github.com"
          git checkout -b "$branch"; git add public/data/media-tone.json
          git commit -m "Refresh media tone data ($(date -u +%F))"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Refresh media tone data ($(date -u +%F))" --body "Automated daily rebuild of how each country's media report on the UAE (GDELT event tone, 45 days). Tone of coverage, not stance."
